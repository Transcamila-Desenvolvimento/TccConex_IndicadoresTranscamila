name: Validação contínua

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar e compilar
        working-directory: frontend
        run: |
          npm ci
          npm run build

  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r backend/requirements.txt

      - name: Testes Django (falhas já existentes na main não reprovam o PR)
        continue-on-error: true
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
          DJANGO_DEBUG: 'True'
          USE_CELERY: 'False'
        run: python manage.py test --verbosity 1

  docs:
    name: Documentação (MkDocs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar MkDocs
        run: pip install -r docs/requirements.txt

      - name: Compilar documentação
        env:
          NO_MKDOCS_2_WARNING: '1'
        run: mkdocs build --strict
